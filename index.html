<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driving Test Quiz</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--mute:#5b6770;--line:#d9dfe4;--accent:#1d4e89;--ok:#166534;--okbg:#e3f4e6;--bad:#9b1c1c;--badbg:#fde8e8;--amber:#8a5a00;--amberbg:#fff4d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161a;--card:#1b2127;--ink:#e6eaee;--mute:#9aa5ad;--line:#2d363e;--accent:#7fb2ee;--ok:#7ee2a0;--okbg:#14301f;--bad:#ff9b9b;--badbg:#3a1a1a;--amber:#f2c261;--amberbg:#3a2e12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161a;--card:#1b2127;--ink:#e6eaee;--mute:#9aa5ad;--line:#2d363e;--accent:#7fb2ee;--ok:#7ee2a0;--okbg:#14301f;--bad:#ff9b9b;--badbg:#3a1a1a;--amber:#f2c261;--amberbg:#3a2e12;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}
h2{font-size:19px;line-height:1.3;margin:12px 0}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;text-align:center;font-weight:600}
:root:not([data-theme="light"]) .btn.primary{color:#0b1520}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid .btn{margin:0;text-align:center}
.grid .btn small,.btn small{display:block;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px}
.link{background:none;border:0;color:var(--accent);font:inherit;padding:8px 0;cursor:pointer}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pic{display:block;margin:8px auto;max-width:100%;max-height:230px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:600}
.mark{font-size:22px;font-weight:700;flex:none}
.why{color:var(--mute);font-style:italic;margin:8px 0}
.note{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.score{font-size:44px;font-weight:700;margin:4px 0}
label.sw{display:flex;gap:10px;align-items:center;margin:8px 0;cursor:pointer}
</style></head><body><div class="wrap" id="app"></div>
<script>
const Q=[{"i": 0, "t": "1", "n": 1, "q": "Which car has the right of way?", "o": ["Car C", "Car B", "Car A"], "a": 1, "w": "Right of way goes to the car that does not face a sign, is on the through road, or is not turning across traffic. The other car yields.", "x": "", "m": "12"}, {"i": 1, "t": "1", "n": 2, "q": "Which car gives right of way?", "o": ["Car C", "Car B", "Car A"], "a": 2, "w": "Right of way goes to the car that does not face a sign, is on the through road, or is not turning across traffic. The other car yields.", "x": "", "m": "13"}, {"i": 2, "t": "1", "n": 3, "q": "Which car should stop? (A traffic circle)", "o": ["Car A", "Car C", "Car B"], "a": 2, "w": "In a traffic circle the car entering gives way to traffic already in the circle.", "x": "", "m": "14"}, {"i": 3, "t": "1", "n": 4, "q": "Which car gives right of way?", "o": ["Car B", "Car C", "Car A"], "a": 0, "w": "Right of way goes to the car that does not face a sign, is on the through road, or is not turning across traffic. The other car yields.", "x": "", "m": "15"}, {"i": 4, "t": "1", "n": 5, "q": "Which car gives right of way?", "o": ["Car A", "Car B", "Car C"], "a": 1, "w": "Right of way goes to the car that does not face a sign, is on the through road, or is not turning across traffic. The other car yields.", "x": "", "m": "16"}, {"i": 5, "t": "1", "n": 6, "q": "Which car is breaking the law assuming both are moving?", "o": ["Car B", "Car A", "Car C"], "a": 0, "w": "A car breaks the law when it ignores its sign or fails to yield when the rules say it must. Find who must yield, then pick the car that does not.", "x": "", "m": "17"}, {"i": 6, "t": "1", "n": 7, "q": "The sign indicates:", "o": ["Hospital ahead.", "End of speed restriction", "Broken down vehicle ahead"], "a": 1, "w": "", "x": "", "m": "20"}, {"i": 7, "t": "1", "n": 8, "q": "When approaching this sign, I should:", "o": ["Disengage gears.", "Engage a lower gear", "Apply hand brake"], "a": 1, "w": "", "x": "", "m": "22"}, {"i": 8, "t": "1", "n": 9, "q": "The sign indicates I am:", "o": ["Permitted to make a ‘U’ turn", "Prohibited from making a ‘U’ turn", "Prohibited from turning right"], "a": 1, "w": "", "x": "", "m": "24"}, {"i": 9, "t": "1", "n": 10, "q": "This sign indicates:", "o": ["Width restriction", "Height restriction", "Cattle ahead"], "a": 0, "w": "", "x": "", "m": "26"}, {"i": 10, "t": "1", "n": 11, "q": "At this sign I should:", "o": ["Stop, and only proceed when the road is clear on both sides", "Stop, and only proceed when the road is clear on the right", "Stop, and only proceed when the road is clear on the left"], "a": 0, "w": "", "x": "", "m": "28"}, {"i": 11, "t": "1", "n": 12, "q": "This sign indicates that I:", "o": ["May not park my vehicle", "May park my vehicle", "Expect ‘Lay-by’ ahead"], "a": 0, "w": "", "x": "", "m": "30"}, {"i": 12, "t": "1", "n": 13, "q": "A heavy vehicle may tow not more than:", "o": ["One trailer", "Three trailers", "Two trailers"], "a": 1, "w": "Source key: up to three trailers. Memorize the number.", "x": "", "m": null}, {"i": 13, "t": "1", "n": 14, "q": "When carrying a passenger on my motorcycle, I must:", "o": ["Have headlamps fitted", "Have the petrol tank filled", "Have a pillion and foot rests firmly fixed"], "a": 2, "w": "A passenger needs a fixed seat (pillion) and foot rests. Without them the passenger has no safe place to sit or brace.", "x": "", "m": null}, {"i": 14, "t": "1", "n": 15, "q": "If involved in a SERIOUS accident, I must:", "o": ["Report to a hospital", "Report to police within 48 hours", "Report to police as soon as possible, or within 24 hours."], "a": 2, "w": "Report to police as soon as possible, or within 24 hours. Not 48 hours, and a hospital is not the authority to report to.", "x": "", "m": null}, {"i": 15, "t": "1", "n": 16, "q": "When traveling behind another vehicle at night, I must:", "o": ["Dip my headlamps", "Switch on my sidelights", "Drive slowly"], "a": 0, "w": "Full beam dazzles the driver ahead through the mirrors. Dip your headlamps when following at night.", "x": "", "m": null}, {"i": 16, "t": "1", "n": 17, "q": "When should a horn be used?", "o": ["To attract a friend’s attention", "When warning another road user.", "When cattle are blocking the road ahead"], "a": 1, "w": "A horn warns another road user of danger. It is not for greeting people or moving animals.", "x": "", "m": null}, {"i": 17, "t": "1", "n": 18, "q": "I may park no closer to a corner than:", "o": ["9.5 meters", "15 meters", "7.5 meters"], "a": 2, "w": "The source keys 7.5 m here and 7 m elsewhere. If 7 m is offered pick 7 m, otherwise 7.5 m.", "x": "", "m": null}, {"i": 18, "t": "1", "n": 19, "q": "At an intersection with a flashing amber robot, I would:", "o": ["Wait until the road ahead is clear", "Give right of way to vehicles from the left", "Give right of way to vehicles from the right"], "a": 2, "w": "A flashing amber robot is treated like an uncontrolled junction. Give way to traffic from the right.", "x": "", "m": null}, {"i": 19, "t": "1", "n": 20, "q": "In which circumstances would I proceed against a red robot?", "o": ["When the green arrow is illuminated", "When there is no approaching traffic", "When the road is clear on the right"], "a": 0, "w": "Only a green arrow (or a police officer’s signal) lets you move against a red robot.", "x": "", "m": null}, {"i": 20, "t": "1", "n": 21, "q": "Which is the correct robot light sequence?", "o": ["Red, Amber, Green", "Red, Green, Amber", "Green, Red, Amber"], "a": 1, "w": "The cycle is Green, Amber, Red, then Green again. Each correct option is that cycle read from a different start. Wrong options skip a step.", "x": "", "m": null}, {"i": 21, "t": "1", "n": 22, "q": "A driver sees a continuous white line in the centre of the road, he or she", "o": ["May cross if there is no oncoming traffic", "May not cross", "May cross in rural areas"], "a": 1, "w": "A continuous line is a prohibition. Do not cross it.", "x": "", "m": null}, {"i": 22, "t": "1", "n": 23, "q": "A broken white line beside a continuous white line in the centre of the road indicates that:", "o": ["I may overtake if the continuous white line is on my side", "I may overtake if the broken line is on my side", "I must keep well left"], "a": 1, "w": "Obey the line nearest your lane. If the broken line is on your side, you may overtake.", "x": "", "m": null}, {"i": 23, "t": "1", "n": 24, "q": "A broken yellow line on the left hand side of the road indicates:", "o": ["It may not be straddled", "It may be straddled to overtake traffic which is turning right", "It may be straddled to overtake cyclists"], "a": 1, "w": "A broken yellow line on the left edge may be straddled to pass a vehicle that is turning right.", "x": "", "m": null}, {"i": 24, "t": "1", "n": 25, "q": "What must you do when meeting a motor vehicle displaying ‘L’ plates?", "o": ["Hoot if the vehicle is blocking your path", "Exercise extreme caution", "Flash my headlights"], "a": 1, "w": "Learners are unpredictable. Give extra space and take extra care. Do not hoot or flash.", "x": "", "m": null}, {"i": 25, "t": "2", "n": 1, "q": "Which car goes last?", "o": ["Car C", "Car A", "Car B"], "a": 1, "w": "Last means the car that must yield to both others. Check signs beside each car first, then turning, right-hand and through-road rules.", "x": "", "m": "38"}, {"i": 26, "t": "2", "n": 2, "q": "Which car is breaking the law assuming vehicles are moving?", "o": ["Car A", "Car C", "Car B"], "a": 1, "w": "A car breaks the law when it ignores its sign or fails to yield when the rules say it must. Find who must yield, then pick the car that does not.", "x": "", "m": "40"}, {"i": 27, "t": "2", "n": 3, "q": "This sign indicates?", "o": ["Railway station", "Rail-road level crossing", "An intersection"], "a": 1, "w": "", "x": "", "m": "42"}, {"i": 28, "t": "2", "n": 4, "q": "The driver may not park closer to the corner than:", "o": ["6.5m", "7m", "All of the above"], "a": 2, "w": "Source key quirk: the options are 6.5 m, 7 m and ‘all of the above’. Take it as keyed.", "x": "", "m": null}, {"i": 29, "t": "2", "n": 5, "q": "Cyclists should ride:", "o": ["As many as possible abreast", "Two abreast", "Single file."], "a": 2, "w": "Riding abreast blocks the lane and forces traffic to swerve. Ride in single file.", "x": "", "m": null}, {"i": 30, "t": "2", "n": 6, "q": "When facing a red robot with an illuminated straight ahead Green arrow, I may:", "o": ["Proceed straight ahead", "Turn right should I wish", "Not proceed"], "a": 0, "w": "A green arrow overrides red for that direction only. Go straight. Do not turn right.", "x": "", "m": null}, {"i": 31, "t": "2", "n": 7, "q": "Which is the correct light sequence at a robot?", "o": ["Amber, Red, Green", "Red, Amber, Green", "Green, Red, Amber"], "a": 0, "w": "The cycle is Green, Amber, Red, then Green again. Each correct option is that cycle read from a different start. Wrong options skip a step.", "x": "", "m": null}, {"i": 32, "t": "2", "n": 8, "q": "A continuous white line in the center of the road may:", "o": ["Be crossed if the road ahead is clear", "Not be crossed for the purposes of overtaking", "Be crossed only on highways"], "a": 1, "w": "Overtaking means crossing the line, and a continuous line may not be crossed.", "x": "", "m": null}, {"i": 33, "t": "2", "n": 9, "q": "Direction arrows used in conjunction with prohibition lines on a road surface:", "o": ["Are for information purposes only", "Relate to taxi drivers only", "Have a regulatory effect"], "a": 2, "w": "Arrows painted with prohibition lines mark lanes you must follow. They have regulatory effect.", "x": "", "m": null}, {"i": 34, "t": "2", "n": 10, "q": "Which cars can move without breaking the law?", "o": ["Car A and Car C", "Car B only", "Both Car A and B"], "a": 2, "w": "A car breaks the law when it ignores its sign or fails to yield when the rules say it must. Find who must yield, then pick the car that does not.", "x": "", "m": "46"}, {"i": 35, "t": "2", "n": 11, "q": "I should always yield right of way to", "o": ["Ambulance and fire engine sounding a siren", "Presidential motorcade", "All of the above"], "a": 2, "w": "Emergency vehicles with sirens and official motorcades have priority. Yield to all of them.", "x": "", "m": null}, {"i": 36, "t": "2", "n": 12, "q": "This sign indicates?", "o": ["Danger of stray animals", "Danger of wild animals", "Danger of farm animals"], "a": 2, "w": "", "x": "", "m": "48"}, {"i": 37, "t": "2", "n": 13, "q": "A solid yellow line on the left hand side of the road indicates:", "o": ["It may be straddled to overtake traffic which is turning right", "It may be straddled to overtake cyclists", "It may not be straddled"], "a": 2, "w": "A solid yellow line may not be straddled. Only a broken yellow line may.", "x": "", "m": null}, {"i": 38, "t": "2", "n": 14, "q": "This sign indicates?", "o": ["Hump ahead", "Dip or ridge ahead", "Mountains ahead"], "a": 1, "w": "", "x": "", "m": "52"}, {"i": 39, "t": "2", "n": 15, "q": "This sign means that:", "o": ["Rail road level crossing ahead", "Traffic lights and rail road crossing ahead", "Traffic lights out of order"], "a": 2, "w": "", "x": "", "m": "54"}, {"i": 40, "t": "2", "n": 16, "q": "Which car stops?", "o": ["Car A", "Car B", "Car C"], "a": 0, "w": "The car that must yield stops. It faces a stop or give way sign, is on the road that ends, is turning right across traffic, or is entering a circle.", "x": "", "m": "56"}, {"i": 41, "t": "2", "n": 17, "q": "Which car moves last at this intersection?", "o": ["Car B", "Car A", "Car C"], "a": 1, "w": "Last means the car that must yield to both others. Check signs beside each car first, then turning, right-hand and through-road rules.", "x": "", "m": "58"}, {"i": 42, "t": "2", "n": 18, "q": "Which car goes last?", "o": ["Car C", "Car B", "Car A"], "a": 1, "w": "Last means the car that must yield to both others. Check signs beside each car first, then turning, right-hand and through-road rules.", "x": "", "m": "60"}, {"i": 43, "t": "2", "n": 19, "q": "When traveling at 90km/h I must leave a gap of:", "o": ["Six vehicle lengths", "Five vehicle lengths", "Seven vehicle lengths"], "a": 0, "w": "Leave 1 vehicle length per 15 km/h. 90 / 15 = 6 lengths.", "x": "", "m": null}, {"i": 44, "t": "2", "n": 20, "q": "When approaching a give way sign:", "o": ["I am obliged to stop before proceeding", "I am obliged to give way to traffic approaching the intersection on my right only", "I may proceed with caution and without stopping provided there is no other approaching traffic"], "a": 2, "w": "A give way sign means slow down and yield to cross traffic. You stop only if traffic is coming.", "x": "", "m": null}, {"i": 45, "t": "2", "n": 21, "q": "I must dip my headlamps:", "o": ["When approaching a railway level crossing.", "When driving in a well lit area", "When approaching an urban area"], "a": 1, "w": "Source key: dip your headlamps in a well lit area. Full beam is for dark roads with no other traffic.", "x": "", "m": null}, {"i": 46, "t": "2", "n": 22, "q": "In rural areas where traffic is not controlled, I should give precedence to:", "o": ["Traffic approaching from a road on the left.", "Traffic approaching from a road on the right.", "Traffic already in the intersection regardless of which side it is coming from"], "a": 2, "w": "On uncontrolled rural junctions the vehicle already in the intersection goes first, whichever side it came from.", "x": "", "m": null}, {"i": 47, "t": "2", "n": 23, "q": "The insignia of a warning sign is:", "o": ["A triangle", "A circle", "A rectangle"], "a": 0, "w": "Triangles warn. Circles command. Rectangles inform.", "x": "", "m": null}, {"i": 48, "t": "2", "n": 24, "q": "When approaching a narrow bridge, I must pay attention to:", "o": ["Height restriction", "Length restriction", "Width restriction"], "a": 2, "w": "A narrow bridge limits how wide a vehicle can be. Watch for the width restriction.", "x": "", "m": null}, {"i": 49, "t": "2", "n": 25, "q": "At a robot-controlled intersection where you have stopped over the pedestrian crossing lines, what do", "o": ["Decide to carry on", "Reverse the vehicle", "Stay where you are"], "a": 2, "w": "Do not reverse or push on. Both endanger pedestrians and cross traffic. Stay where you are.", "x": "", "m": null}, {"i": 50, "t": "3", "n": 1, "q": "Before driving a motor vehicle on a public road, it must have the following:", "o": ["Certificate of fitness and a repair card.", "Learner’s licence.", "Registration book, insurance and a vehicle licence."], "a": 2, "w": "Registration book, insurance and vehicle licence show the car is registered, covered and legal. A learner’s licence is for a person, not a vehicle.", "x": "", "m": null}, {"i": 51, "t": "3", "n": 2, "q": "The correct sequence of a robot traffic light is:", "o": ["Amber, Green, Red.", "Green, Amber, Red.", "Red, Amber, Green"], "a": 1, "w": "The cycle is Green, Amber, Red, then Green again. Each correct option is that cycle read from a different start. Wrong options skip a step.", "x": "", "m": null}, {"i": 52, "t": "3", "n": 3, "q": "When approaching a pedestrian crossing you should:", "o": ["Sound the horn.", "Accelerate quickly over it.", "Slow down and prepare to stop."], "a": 2, "w": "Slow down and be ready to stop for anyone crossing.", "x": "", "m": null}, {"i": 53, "t": "3", "n": 4, "q": "For cyclists not to interfere with other road users they should ride:", "o": ["Two to three abreast.", "Single file.", "Completely off the road."], "a": 1, "w": "Riding abreast blocks the lane and forces traffic to swerve. Ride in single file.", "x": "", "m": null}, {"i": 54, "t": "3", "n": 5, "q": "A heavy vehicle towing independent trailers must have:", "o": ["Safety chains fitted to the trailers.", "More pulling power.", "As many spare wheels as possible."], "a": 0, "w": "If a coupling fails, safety chains keep the trailer attached to the towing vehicle.", "x": "", "m": null}, {"i": 55 ight of way goes to the car that does not face a sign, is on the through road, or is not turning across traffic. The other car yields.", "x": "", "m": "340"}, {"i": 367, "t": "25", "n": 18, "q": "Animal drawn vehicles must always have", "o": ["Proper working headlights", "Working tail lights", "Reins and a leader"], "a": 2, "w": "Source key: animal drawn vehicles must always have reins and a leader.", "x": "", "m": null}, {"i": 368, "t": "25", "n": 19, "q": "When stopping a motor vehicle on a road except in traffic, where will you stop?", "o": ["On the extreme right of the road", "Stop in the middle if it is safe to do so", "On the extreme left of the road or in an authorized parking place"], "a": 2, "w": "Stop on the extreme left of the road or in an authorized parking place. Never in the middle or on the right.", "x": "", "m": null}, {"i": 369, "t": "25", "n": 20, "q": "How far from a corner are you forbidden to stop your vehicle?", "o": ["7m", "7.5m", "10m"], "a": 0, "w": "Source key: do not park closer than 7 m to a corner.", "x": "", "m": null}, {"i": 370, "t": "25", "n": 21, "q": "When under the influence of drugs or alcohol what must you do?", "o": ["Drive slowly to a safe place", "Stay off the road", "Drive on the extreme left of the road"], "a": 1, "w": "Impaired driving is a danger to everyone. Stay off the road.", "x": "", "m": null}, {"i": 371, "t": "25", "n": 22, "q": "The insignia of a command sign is:", "o": ["A triangle", "A rectangle", "A circle"], "a": 2, "w": "Triangles warn. Circles command. Rectangles inform.", "x": "", "m": null}, {"i": 372, "t": "25", "n": 23, "q": "On which side must you overtake animals which are being led:", "o": ["Left hand side", "Right hand side", "Whichever side is safe"], "a": 2, "w": "Overtake on whichever side is safe.", "x": "", "m": null}, {"i": 373, "t": "25", "n": 24, "q": "What are the directions given by fixed or flashing amber robot at an intersection?", "o": ["Give precedence to all cross traffic", "Give precedence to all vehicles coming from the right", "Give precedence to vehicles coming from the left"], "a": 1, "w": "A flashing amber robot is treated like an uncontrolled junction. Give way to traffic from the right.", "x": "", "m": null}, {"i": 374, "t": "25", "n": 25, "q": "Which car goes first?", "o": ["Car A", "Car B", "Car C"], "a": 1, "w": "First means the car that yields to no one.", "x": "", "m": "344"}, {"i": 375, "t": "26", "n": 1, "q": "When traveling at 60km/h, what distance should you leave between your vehicle and the vehicle in front?", "o": ["6 vehicle lengths", "5 vehicle lengths", "4 vehicle lengths"], "a": 2, "w": "Leave 1 vehicle length per 15 km/h. 60 / 15 = 4 lengths.", "x": "", "m": null}, {"i": 376, "t": "26", "n": 2, "q": "When a fire engine, ambulance or police vehicle approaches sounding its special warning device, what", "o": ["Move as fast as possible", "Move out of its course and stop", "Move slowly on the left side"], "a": 1, "w": "Move out of the way and stop so the emergency vehicle can pass.", "x": "", "m": null}, {"i": 377, "t": "26", "n": 3, "q": "What time should persons driving on the road switch on their headlights?", "o": ["Between 5:30pm and 6:30am", "Between 5:30am and 6:30pm", "Any convenient time"], "a": 0, "w": "Source key: headlights on from 5:30pm to 6:30am.", "x": "", "m": null}, {"i": 378, "t": "26", "n": 4, "q": "If you are dazzled by the light of other vehicle, what must you do?", "o": ["Dip, get out of the way and slow down", "Retaliate", "Increase your speed"], "a": 0, "w": "Dip your lights, get out of the way and slow down. Do not retaliate or speed up.", "x": "", "m": null}, {"i": 379, "t": "26", "n": 5, "q": "When you are driving and feel sleepy, what must you do?", "o": ["Maintain a slow speed", "Move off the road and rest", "Maintain a high speed"], "a": 1, "w": "Tiredness slows reaction. Pull off the road and rest.", "x": "", "m": null}, {"i": 380, "t": "26", "n": 6, "q": "All vehicles shall have:", "o": ["Red reflectors in front", "White reflectors in front", "Either red or white reflectors in front"], "a": 1, "w": "Source key: white reflectors at the front.", "x": "", "m": null}, {"i": 381, "t": "26", "n": 7, "q": "The law says when driving a motor vehicle at 6.00am the vehicle must have its headlights lit:", "o": ["Yes", "No", "Depends on day light"], "a": 0, "w": "Yes. Headlights are required between 5:30pm and 6:30am, so at 6:00am they must be on.", "x": "", "m": null}, {"i": 382, "t": "26", "n": 8, "q": "In a traffic circle, I shall indicate:", "o": ["When going out", "When going in", "When making a ‘U’ turn"], "a": 0, "w": "Indicate when leaving the circle so other drivers know your exit.", "x": "", "m": null}, {"i": 383, "t": "26", "n": 9, "q": "A vehicle turning right should", "o": ["Give way to window shopping pedestrians", "Give way to oncoming traffic", "Give way to pedestrians standing on the pavement."], "a": 1, "w": "A right turn crosses the path of oncoming traffic. Give way to it.", "x": "", "m": null}, {"i": 384, "t": "26", "n": 10, "q": "What is the legal maximum speed on a Zimbabwean Highway?", "o": ["120km/h for all vehicles", "Between 80 and 120 km/h on all roads.", "120km/h for light vehicles and 80km/h for heavy vehicles"], "a": 2, "w": "Source key: 120 km/h for light vehicles and 80 km/h for heavy vehicles.", "x": "", "m": null}, {"i": 385, "t": "26", "n": 11, "q": "Which car goes last?", "o": ["Car B", "Car A", "Car C"], "a": 2, "w": "Last means the car that must yield to both others. Check signs beside each car first, then turning, right-hand and through-road rules.", "x": "", "m": "153"}, {"i": 386, "t": "26", "n": 12, "q": "Which car goes last?", "o": ["Car C", "Car B", "Car A"], "a": 1, "w": "Last means the car that must yield to both others. Check signs beside each car first, then turning, right-hand and through-road rules.", "x": "", "m": "350"}, {"i": 387, "t": "26", "n": 13, "q": "What must you do before you change direction?", "o": ["Signal my intention when turning left only", "Signal my intention when turning right only", "Signal my intention before acting and see that the road is clear before changing direction"], "a": 2, "w": "Signal your intention before acting and make sure the road is clear before you change direction.", "x": "", "m": null}, {"i": 388, "t": "26", "n": 14, "q": "This sign regulates:", "o": ["Time restriction", "Speed restriction", "Weight restriction"], "a": 2, "w": "", "x": "", "m": "352"}, {"i": 389, "t": "26", "n": 15, "q": "This sign regulates that:", "o": ["Vehicles should give precedence to traffic oncoming from the road on the right", "Vehicles should give precedence to traffic coming from the left", "Vehicles should give precedence to all cross traffic"], "a": 2, "w": "", "x": "", "m": "76"}, {"i": 390, "t": "26", "n": 16, "q": "When travelling at 75km/h I must leave a gap of:", "o": ["Four vehicle lengths.", "Seven vehicle lengths", "Five vehicle lengths"], "a": 2, "w": "Leave 1 vehicle length per 15 km/h. 75 / 15 = 5 lengths.", "x": "", "m": null}, {"i": 391, "t": "26", "n": 17, "q": "Which car goes last?", "o": ["Car C", "Car A", "Car B"], "a": 1, "w": "Last means the car that must yield to both others. Check signs beside each car first, then turning, right-hand and through-road rules.", "x": "", "m": "356"}, {"i": 392, "t": "26", "n": 18, "q": "Which car gives right of way?", "o": ["Car A", "Car C", "Car B"], "a": 1, "w": "Right of way goes to the car that does not face a sign, is on the through road, or is not turning across traffic. The other car yields.", "x": "", "m": "358"}, {"i": 393, "t": "26", "n": 19, "q": "When in a straight ahead lane at an intersection I am not allowed to:", "o": ["Turn without indicating", "Turn at all", "Turn without requesting", "Turn without checking blind spots"], "a": 1, "w": "From a straight ahead lane you may go straight only. Turning is not allowed.", "x": "", "m": null}, {"i": 394, "t": "26", "n": 20, "q": "At a bridge, I am not allowed to:", "o": ["Overtake slow moving vehicles", "Slow down and check the road ahead", "Dip my lights even for oncoming vehicles"], "a": 0, "w": "Do not overtake on or near a bridge. Slow down and check the road ahead.", "x": "", "m": null}, {"i": 395, "t": "26", "n": 21, "q": "A speed restriction sign means:", "o": ["Do not exceed the stated speed", "Drive below the stated speed", "Do not exceed the stated speed"], "a": 2, "w": "A speed restriction sign sets a maximum. Do not exceed the stated speed.", "x": "", "m": null}, {"i": 396, "t": "26", "n": 22, "q": "When I intend to stop on the road I must:", "o": ["Flash my hazard lights", "Slow down and stop", "Slow down, check the rear view mirror and stop"], "a": 2, "w": "Slow down, check your mirror, signal, pull off the road, then stop. The full sequence is the safest.", "x": "", "m": null}, {"i": 397, "t": "26", "n": 23, "q": "At a rail level crossing with open booms a driver should", "o": ["Quickly cross the railway", "Look both sides and cross", "Stop and look to the right"], "a": 1, "w": "Look both ways and cross only when it is safe, even when the booms are open.", "x": "", "m": null}, {"i": 398, "t": "26", "n": 24, "q": "The purpose of the parking brake is to", "o": ["Keep the vehicle stationary", "Keep the vehicle stationary on a gradient only", "Slow the vehicle down"], "a": 0, "w": "The parking brake keeps the vehicle stationary.", "x": "", "m": null}, {"i": 399, "t": "26", "n": 25, "q": "At a pedestrian cross every driver must", "o": ["A.Wave the pedestrians through", "B.Hoot when it is his turn to go", "C.Wait patiently and proceed when appropriate"], "a": 2, "w": "Be patient and move on only when the crossing is clear.", "x": "", "m": null}];

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let queue=[],pos=0,score=0,done=false,shuffle=true,missed=[];
const KEY='vid-quiz-missed';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
const tests=[...new Set(Q.map(q=>q.t))];
function menu(){
  const wrong=load().filter(i=>Q[i]);
  app.innerHTML=`<h1>Driving Test Quiz</h1><p class="sub">${Q.length} questions from your file. Tap an answer. Green tick means correct. Red cross means wrong.</p>
  <label class="sw"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle question order</label>
  <button class="btn primary" data-all="1">All questions (${Q.length})</button>
  ${wrong.length?`<button class="btn" data-miss="1">Practise my mistakes (${wrong.length})</button>`:''}
  <h2>Pick a test</h2><div class="grid">${tests.map(t=>`<button class="btn" data-t="${t}">Test ${t}<small>${Q.filter(q=>q.t===t).length} questions</small></button>`).join('')}</div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    shuffle=document.getElementById('shuf').checked;
    if(b.dataset.all)start(Q.map((_,i)=>i));
    else if(b.dataset.miss)start(wrong);
    else if(b.dataset.t)start(Q.map((q,i)=>q.t===b.dataset.t?i:-1).filter(i=>i>=0));};
}
function start(ids){
  queue=ids.slice();
  if(shuffle)for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  pos=0;score=0;missed=[];show();
}
function show(){
  if(pos>=queue.length)return finish();
  const q=Q[queue[pos]];let answered=false;
  app.innerHTML=`<div class="top"><button class="link" id="back">\u2190 Menu</button><span>Score ${score}</span></div>
  <div class="bar"><i style="width:${pos/queue.length*100}%"></i></div>
  <div class="top"><span>Question ${pos+1} of ${queue.length}</span><span>Test ${q.t} \u00b7 Q${q.n}</span></div>
  <div class="card">${q.m?`<img class="pic" alt="Diagram or sign for this question" src="${IM[q.m]}">`:''}
  <h2 id="qt" tabindex="-1">${esc(q.q)}</h2>
  ${q.o.map((o,k)=>`<button class="btn opt" data-k="${k}"><span>${esc(o)}</span><span class="mark" aria-hidden="true"></span></button>`).join('')}
  <div id="fb"></div></div><div id="nx"></div>`;
  document.getElementById('back').onclick=menu;
  window.scrollTo(0,0);document.getElementById('qt').focus({preventScroll:true});
  app.onclick=e=>{
    const b=e.target.closest('.opt');if(!b||answered)return;answered=true;
    const k=+b.dataset.k,btns=[...app.querySelectorAll('.opt')];
    const mk=(el,ok)=>{el.classList.add(ok?'ok':'bad');el.querySelector('.mark').textContent=ok?'\u2713':'\u2717';
      el.setAttribute('aria-label',el.firstChild.textContent+(ok?' (correct)':' (wrong)'));};
    const right=k===q.a;
    mk(b,right); if(!right)mk(btns[q.a],true);
    let m=load().filter(i=>i!==queue[pos]);
    if(right)score++;else{m.push(queue[pos]);missed.push(queue[pos]);}
    save(m);
    document.getElementById('fb').innerHTML=(q.w?`<p class="why">${esc(q.w)}</p>`:'')+(q.x?`<div class="note">${esc(q.x)}</div>`:'');
    document.querySelector('.top span:last-child').textContent='Score '+score;
    document.getElementById('nx').innerHTML=`<button class="btn primary" id="next">${pos+1<queue.length?'Next question':'See results'}</button>`;
    document.getElementById('next').onclick=()=>{pos++;show();};
    document.getElementById('next').scrollIntoView({block:'nearest'});
  };
}
function finish(){
  const pct=Math.round(score/queue.length*100);
  app.innerHTML=`<h1>Results</h1><div class="card"><div class="score">${score} / ${queue.length}</div><p class="sub">${pct}% correct</p></div>
  ${missed.length?`<button class="btn primary" id="rm">Retry the ${missed.length} I got wrong</button>`:''}
  <button class="btn" id="mn">Back to menu</button>`;
  window.scrollTo(0,0);
  app.onclick=null;
  document.getElementById('mn').onclick=menu;
  const r=document.getElementById('rm');if(r)r.onclick=()=>start(missed.slice());
}
menu();
</script></body></html>
